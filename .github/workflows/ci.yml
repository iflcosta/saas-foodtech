name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node — lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_foodtech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_foodtech"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_foodtech
      INTEGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_foodtech
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:push -w packages/db -- --force
      - run: npm run test

  go:
    name: Go — bridge build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
